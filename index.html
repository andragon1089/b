<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick – Laura Dannon Flashcards</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f5f7;color:#20242b;font-family:Arial, sans-serif;display:flex;justify-content:center;align-items:center;padding:24px}
.app{width:min(720px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:clamp(21px,4vw,29px);margin:0}.count{color:#646b76;font-size:14px;white-space:nowrap}
.progress{height:6px;background:#e0e3e8;border-radius:99px;overflow:hidden;margin-bottom:22px}.bar{height:100%;width:0;background:#343b48;transition:width .2s}
.card{min-height:300px;background:white;border:1px solid #e1e4e9;border-radius:18px;box-shadow:0 8px 28px #1822300d;display:flex;align-items:center;justify-content:center;text-align:center;padding:42px 30px;cursor:pointer;user-select:none}
.card-inner{width:100%}.side{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:#7b8491;margin-bottom:20px}.words{font-size:clamp(22px,4vw,32px);line-height:1.4;font-weight:600}.hint{text-align:center;color:#747c88;font-size:13px;margin:14px 0 22px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:1px solid #d6dae1;background:white;color:#252a32;padding:12px 19px;border-radius:10px;font-size:15px;cursor:pointer}button:hover{background:#eef0f3}button.primary{background:#252a32;color:white;border-color:#252a32}button.primary:hover{background:#414854}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:#737b86;font-size:13px;gap:12px}.bottom button{font-size:13px;padding:8px 12px}
@media(max-width:480px){.card{min-height:270px;padding:30px 20px}.bottom{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="app">
<header><h1>Brick – Laura Dannon</h1><div class="count" id="count"></div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard. Click to reveal answer">
  <div class="card-inner"><div class="side" id="side">Question</div><div class="words" id="words"></div></div>
</div>
<div class="hint">Click the card or press Space to flip it</div>
<div class="controls">
<button id="prev">← Previous</button><button class="primary" id="flip">Show answer</button><button id="next">Next →</button>
</div>
<div class="bottom"><span id="position"></span><div><button id="shuffle">Shuffle</button> <button id="restart">Start again</button></div></div>
</main>
<script>
const originalCards = [{"id": 1, "front": "What is the central message of Brick?", "back": "Stories provide certainty, but concealed authorship makes them dangerous."}, {"id": 2, "front": "What is concealed authorship?", "back": "Controlling what information others receive and therefore what they believe."}, {"id": 3, "front": "How is Laura initially presented?", "back": "Trustworthy, useful, attractive and well-connected."}, {"id": 4, "front": "What happens in the party scene?", "back": "Laura directs Brendan to Coffee and Pie, Oh My!"}, {"id": 5, "front": "What lighting surrounds Laura at the party?", "back": "Soft, warm lighting creates an angel-like halo."}, {"id": 6, "front": "What does the smooth jazz achieve?", "back": "Creates a relaxed atmosphere and encourages trust."}, {"id": 7, "front": "What is the noir femme fatale?", "back": "An attractive woman whose appeal disguises her dangerous intentions."}, {"id": 8, "front": "How does Laura control Brendan's investigation?", "back": "She controls who he meets and what information he receives."}, {"id": 9, "front": "What does Laura do instead of telling one defining lie?", "back": "Supplies, withholds and selectively distributes information."}, {"id": 10, "front": "How do camera cuts represent Laura's manipulation?", "back": "They mirror her control over what the audience sees and knows."}, {"id": 11, "front": "What does the shadow across Laura's face suggest?", "back": "She only reveals partial truths and conceals her intentions."}, {"id": 12, "front": "What is Walter Fisher's narrative paradigm?", "back": "People accept stories through coherence, not necessarily verification."}, {"id": 13, "front": "What is Erich Fromm's Escape from Freedom about?", "back": "Isolation and anxiety make people seek security and certainty."}, {"id": 14, "front": "Why is Brendan vulnerable despite being intelligent?", "back": "His vulnerability is situational, caused by social isolation."}, {"id": 15, "front": "What happens when Emily and Tug hold conflicting beliefs?", "back": "Their incompatible understandings contribute to Emily's death."}, {"id": 16, "front": "What does Hannah Arendt argue in Truth and Politics?", "back": "Shared facts hold society together; disinformation damages it."}, {"id": 17, "front": "How do Dutch angles contribute to the message?", "back": "Disorientating perspectives visually represent unstable realities."}, {"id": 18, "front": "What is Roland Barthes' hermeneutic code?", "back": "An enigma creates curiosity, delays answers and eventually resolves."}, {"id": 19, "front": "How does Johnson manipulate the audience?", "back": "We follow Brendan's perspective and trust Laura until her revelation."}, {"id": 20, "front": "What is the essay's final takeaway?", "back": "Being comfortable with a story does not make it true."}, {"id": 21, "front": "Why does Brendan trust Laura before she earns it?", "back": "She appears helpful, attractive and well-connected; her trustworthiness is performed."}, {"id": 22, "front": "What does Laura's position as a well-connected insider allow her to do?", "back": "Move between people Brendan needs to reach and control his access to them."}, {"id": 23, "front": "What exact lead does Laura give Brendan at the party?", "back": "She directs him to the store 'Coffee and Pie, Oh My!' when he asks about Emily."}, {"id": 24, "front": "How do lighting and music make Laura seem trustworthy?", "back": "Soft, warm, halo-like lighting and smooth jazz create an inviting, reassuring impression."}, {"id": 25, "front": "How does Laura resemble a noir femme fatale?", "back": "Her attractiveness and helpful appearance camouflage her dangerous intentions."}, {"id": 26, "front": "What does Laura reveal at the party — and what does she conceal?", "back": "She gives Brendan a location, but not her own role or the wider truth."}, {"id": 27, "front": "How does Laura frame Emily?", "back": "She presents Emily as responsible for stealing a brick of heroin."}, {"id": 28, "front": "What uncertainty surrounds Tug's attack on Emily?", "back": "He may react to news of Emily's baby, or Laura may have told him to kill her; this is not confirmed."}, {"id": 29, "front": "How does Laura's framing affect Dode?", "back": "Dode believes Tug killed Emily because she had a baby, leading Tug to shoot him."}, {"id": 30, "front": "What is the effect of Laura's selective information?", "back": "False certainty creates a domino effect of misunderstandings, suspicion and violence."}, {"id": 31, "front": "How does the camera mimic Laura's control of information?", "back": "It often cuts away after she speaks, limiting what viewers see and know."}, {"id": 32, "front": "What is significant about Laura's face in the scene after the Pin's house?", "back": "Her face remains partly hidden in shadow as she explains why she is helping Brendan, suggesting partial truth."}, {"id": 33, "front": "What does Brendan's isolation look like on screen?", "back": "He often walks alone with a hunched back; his interactions are curt and intense."}, {"id": 34, "front": "How does Brendan reject social support?", "back": "He rejects institutional help and group belonging, and persists with his investigation despite the harm."}, {"id": 35, "front": "When is Brendan's alienation especially visible?", "back": "In the scene where Dode is killed, Brendan is almost entirely ignored."}, {"id": 36, "front": "What does Fromm's Escape from Freedom (1941) explain?", "back": "Isolation and anxiety after losing traditional bonds can make people seek security in a person or system."}, {"id": 37, "front": "How does Emily demonstrate the desire for certainty?", "back": "Insecure and seeking a new community, she trusts Laura as the first person offering believable narratives."}, {"id": 38, "front": "How does Tug become controlled by Laura?", "back": "He believes her coherent stories and relies on them to make decisions without recognising her influence."}, {"id": 39, "front": "Why isn't Brendan's acceptance of Laura simply stupidity?", "back": "He is sceptical, analytical and intelligent; his vulnerability comes from isolation, not intellectual weakness."}, {"id": 40, "front": "What does the fragmented chronology communicate?", "back": "Jumps between times reinforce the incongruity between characters' conflicting versions of reality."}, {"id": 41, "front": "Where are Dutch tilts and distorted perspectives especially noticeable?", "back": "When Brendan discovers a brick and during the final confrontation."}, {"id": 42, "front": "What do the jarred camera movement and distorted distances suggest?", "back": "They make unstable, conflicting versions of truth feel disorientating to the viewer."}, {"id": 43, "front": "What does Arendt's 'Truth and Politics' (1967) argue?", "back": "Shared facts hold people together; disinformation damages the common understanding society needs."}, {"id": 44, "front": "What is the comparison with Cixin Liu's The Dark Forest?", "back": "When trust and shared truth collapse, suspicion can make destroying others seem rational."}, {"id": 45, "front": "How does Barthes' hermeneutic code relate to Brick?", "back": "A mystery creates an enigma, delays its answer and eventually resolves it, exploiting our desire for closure."}, {"id": 46, "front": "How does Johnson make the audience experience Laura's manipulation?", "back": "We follow Brendan's limited perspective and initially trust Laura, then discover our assumptions were wrong."}, {"id": 47, "front": "What does Laura's final revelation make the audience reconsider?", "back": "Her earlier helpfulness and apparent honesty; the audience has been deceived alongside Brendan."}];
let cards=[...originalCards], index=0, flipped=false;
const $=id=>document.getElementById(id);
function render(){const c=cards[index];$('side').textContent=flipped?'Answer':'Question';$('words').textContent=flipped?c.back:c.front;$('count').textContent=`${index+1} / ${cards.length}`;$('position').textContent=`Card ${index+1} of ${cards.length}`;$('bar').style.width=`${(index+1)/cards.length*100}%`;$('flip').textContent=flipped?'Show question':'Show answer';$('prev').disabled=index===0;$('next').disabled=index===cards.length-1;}
function flip(){flipped=!flipped;render()}function next(){if(index<cards.length-1){index++;flipped=false;render()}}function prev(){if(index>0){index--;flipped=false;render()}}
$('card').addEventListener('click',flip);$('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});$('flip').addEventListener('click',flip);$('next').addEventListener('click',next);$('prev').addEventListener('click',prev);
$('shuffle').addEventListener('click',()=>{for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;flipped=false;render()});$('restart').addEventListener('click',()=>{cards=[...originalCards];index=0;flipped=false;render()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();flip()}});
render();
</script>
</body>
</html>
